<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    /* The outline stays dark in both themes: it is drawn over the white body,
       so it reads on a light tab bar and on a dark one alike. */
    .ln    { stroke: #1d1a24; stroke-width: 3; stroke-linecap: round; }
    .body  { fill: #ffffff; }
    .lens  { fill: #5b4bc4; }
    .glint { fill: #ffffff; }
    /* The antenna sits outside the body, against the bare tab background,
       so this is the one part that has to flip. */
    .ant   { stroke: #1d1a24; }
    .dot   { fill: #1d1a24; }
    @media (prefers-color-scheme: dark) {
      .ant  { stroke: #f3eee6; }
      .dot  { fill: #f3eee6; }
      .lens { fill: #8b7ae8; }
    }
  </style>

  <path class="ln ant" d="M32 13V6" fill="none" />
  <circle class="ln ant dot" cx="32" cy="4.5" r="3" />
  <rect class="ln body" x="6" y="12" width="52" height="46" rx="13" />
  <circle class="ln lens" cx="32" cy="35" r="12" />
  <circle class="glint" cx="27.5" cy="30" r="3.8" opacity=".85" />
</svg>
